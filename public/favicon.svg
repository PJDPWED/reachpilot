<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background: pure black -->
  <rect width="32" height="32" fill="#000000"/>
  <!-- Rocket body -->
  <rect x="14" y="6"  width="4"  height="10" fill="#FFFFFF"/>
  <rect x="12" y="10" width="8"  height="8"  fill="#FFFFFF"/>
  <!-- Nose cone: gold -->
  <rect x="14" y="3"  width="4"  height="4"  fill="#FFCE00"/>
  <!-- Wings: red -->
  <rect x="9"  y="16" width="5"  height="5"  fill="#FF0000"/>
  <rect x="18" y="16" width="5"  height="5"  fill="#FF0000"/>
  <!-- Exhaust: red → gold -->
  <rect x="14" y="20" width="4"  height="3"  fill="#FF0000"/>
  <rect x="15" y="22" width="2"  height="3"  fill="#FFCE00"/>
  <!-- Window: black dot on white body -->
  <rect x="15" y="11" width="2"  height="2"  fill="#000000"/>
  <!-- Red outline accent -->
  <rect x="12" y="10" width="8"  height="1"  fill="#FF0000" opacity="0.4"/>
</svg>
